</g></g></g><rect x="100" y="758" width="1720" height="242" rx="29" fill="#D7EDDF" /><g id="Definition"><text x="145" y="828" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#4C765C" text-anchor="start">우리가 말하는 ‘일시적 권태’</text><text x="146" y="901" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="47" font-weight="600" fill="#242424" text-anchor="start">집중이 흐트러진 순간, 손쉽게 닿는 새 자극으로 관심이 옮겨가</text><text x="146" y="962" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="47" font-weight="600" fill="#242424" text-anchor="start">원래 하던 공부를 이어가지 못하는 상태.</text></g></svg>