<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" id="Pocus-02"><title>공부 × 덜어내기</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FAFAFA" id="Background" /><g id="Study-and-subtraction"><text x="112" y="142" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="64" font-weight="800" fill="#242424" text-anchor="start">공부 × 덜어내기</text><text x="112" y="332" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="68" font-weight="700" fill="#242424" text-anchor="start">풀이를 찾던 호진은 왜</text><text x="112" y="415" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="68" font-weight="700" fill="#242424" text-anchor="start">영상을 보고 있을까?</text><text x="116" y="490" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="39" font-weight="500" fill="#242424" text-anchor="start">자취방에서 자격증 시험을 준비한다.</text><text x="116" y="545" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="39" font-weight="500" fill="#242424" text-anchor="start">문제 풀이를 찾으려고 휴대폰을 켠다.</text><text x="116" y="600" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="39" font-weight="500" fill="#242424" text-anchor="start">메시지를 확인하다 짧은 영상을 연다.</text><text x="116" y="655" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="39" font-weight="500" fill="#242424" text-anchor="start">한참 뒤 후회하면서도 다음 영상을 누른다.</text></g><g id="Study-illustration"><rect x="1114" y="185" width="688" height="493" rx="45" fill="#ECF6F0" /><g id="entry-illustration-all" transform="translate(1140 220) scale(1.62)" fill="none"><defs><clipPath id="Illustration-crop"><rect x="0" y="0" width="393" height="286" rx="0" fill="#FFFFFF" /></clipPath></defs><g id="Entry-artwork" clip-path="url(#Illustration-crop)"><path d="M-139 160.096C13.6149 151.291 113.027 118.242 128.271 45.9872C141.171 -15.158 61.3988 -13.4492 45.0226 56.7159C29.4656 123.371 79.2458 231.491 197.705 241.305C341.089 253.183 