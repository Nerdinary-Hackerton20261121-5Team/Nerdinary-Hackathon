<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" id="Pocus-03"><title>덜어내기의 정의와 Pocus의 선택</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#ECF6F0" id="Background" /><g id="Subtraction-definition"><text x="112" y="153" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="47" font-weight="700" fill="#4C765C" text-anchor="start">덜어내기의 정의</text><text x="108" y="316" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="78" font-weight="800" fill="#2C4536" text-anchor="start">일시적 권태를 야기하는</text><text x="108" y="408" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="78" font-weight="800" fill="#2C4536" text-anchor="start">기능들을 덜어낸다.</text></g><rect x="112" y="506" width="928" height="3" rx="0" fill="#D7EDDF" /><g id="Pocus-choice"><text x="112" y="628" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="47" font-weight="700" fill="#4C765C" text-anchor="start">Pocus의 선택</text><text x="112" y="730" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="43" font-weight="600" fill="#242424" text-anchor="start">공부 중에는 각자 자기 일을 한다.</text><text x="112" y="799" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="43" font-weight="600" fill="#242424" text-anchor="start">약속한 시간이 끝났을 때만 서로 다른 조각을 가져와</text><text x="112" y="868" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="43" font-weight="600" fill="#242424" text-anchor="start">한 장의 그림을 함께 맞춘다.</text></g><g id="Shared-picture" transform="translate(1162 278) scale(0.91)"><rect x="0" y="0" width="650" height="638" rx="42" fill="#D7EDDF" /><circle cx="506" cy="158" r="49" fill="#FFFFFF" /><path d="M0 338 Q123 332 220 269 Q310 209 398 271 Q495 334 650 225 V419 H0Z" fill="#7FC499" /><path d="M0 390 Q148 290 268 354 Q431 447 650 298 V482 H0Z" fill="#72B08A" /><path d="M0 451 Q161 362 319 442 Q487 522 650 411 V599 Q650 638 609 638 H42 Q0 638 0 596Z" fill="#4C765C" /><path d="M319 0 V101 C319 114 310 119 299 113 C259 91 236 117 236 146 C236 177 259 201 299 180 C311 174 319 178 319 191 V420 C319 431 326 437 336 431 C377 410 402 436 402 464 C402 495 376 518 336 499 C325 493 319 499 319 511 V638" fill="none" stroke="#FAFAFA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 319 H93 C105 319 111 311 104 300 C83 260 109 236 137 236 C168 236 192 262 172 300 C166 311 171 319 184 319 H451 C463 319 469 327 462 338 C442 377 466 402 497 402 C528 402 550 377 532 339 C526 327 531 319 544 319 H650" fill="none" stroke="#FAFAFA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g></svg>