<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" id="Pocus-04"><title>Pocus의 MVP</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FAFAFA" id="Background" /><g id="MVP-scope"><text x="110" y="155" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="78" font-weight="800" fill="#2C4536" text-anchor="start">Pocus의 MVP</text><text x="114" y="243" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="44" font-weight="500" fill="#242424" text-anchor="start">비회원으로 모여 같은 시간 동안 공부하고, 각자의 퍼즐 조각으로 한 장을 완성한다.</text><text x="112" y="380" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="54" font-weight="700" fill="#4C765C" text-anchor="start">Must have</text></g><rect x="112" y="411" width="1690" height="3" rx="0" fill="#D7EDDF" /><g id="Phase-1"><text x="113" y="491" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="49" font-weight="800" fill="#2C4536" text-anchor="start">세션 시작</text><text x="113" y="574" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#242424" text-anchor="start">파티 개설·비회원 입장</text><text x="113" y="629" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">시간과 사진을 정하고</text><text x="113" y="674" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">초대 링크로 모인다.</text><text x="113" y="737" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#242424" text-anchor="start">공통 타이머</text><text x="113" y="792" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">모두 같은 시각에 공부를 끝낸다.</text></g><g id="Phase-2"><text x="696" y="491" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="49" font-weight="800" fill="#2C4536" text-anchor="start">공부 중</text><text x="696" y="574" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#242424" text-anchor="start">본인 전용 얼굴 미리보기</text><text x="696" y="629" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">카메라 화면은 나만 본다.</text><text x="696" y="737" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#242424" text-anchor="start">퍼즐 배정과 복원</text><text x="696" y="792" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">내 조각은 점점 선명해지고</text><text x="696" y="837" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">다른 사람의 조각은 흐리게 보인다.</text></g><g id="Phase-3"><text x="1279" y="491" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="49" font-weight="800" fill="#2C4536" text-anchor="start">조립과 종료</text><text x="1279" y="574" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#242424" text-anchor="start">공동 조립·팀 통과</text><text x="1279" y="629" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">각자 자기 조각을 옮기고</text><text x="1279" y="674" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">모두 제자리에 놓으면 통과한다.</text><text x="1279" y="737" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#242424" text-anchor="start">세션 종료와 자료 폐기</text><text x="1279" y="792" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">방이 끝나면 사진과 결과 등</text><text x="1279" y="837" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="33" font-weight="500" fill="#242424" text-anchor="start">세션 자료를 지운다.</text></g><rect x="106" y="904" width="1708" height="112" rx="26" fill="#ECF6F0" /><g id="Should-have"><text x="146" y="976" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="42" font-weight="700" fill="#4C765C" text-anchor="start">Should have</text><text x="497" y="975" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="37" font-weight="600" fill="#242424" text-anchor="start">코드로 방 찾기</text><rect x="865" y="942" width="2" height="44" rx="0" fill="#D7EDDF" /><text x="928" y="975" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="37" font-weight="600" fill="#242424" text-anchor="start">세션 개설 전 이미지 필터</text><text x="1370" y="973" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="31" font-weight="500" fill="#4C765C" text-anchor="start">(채택 검토 중)</text></g></svg>